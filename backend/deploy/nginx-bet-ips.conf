# Nginx como proxy inverso delante de uvicorn.
# Copiar a /etc/nginx/sites-available/bet-ips y enlazar en sites-enabled (ver BACKEND.md).
# Cambia api.tu-dominio.com por tu dominio (o la IP publica del EC2 mientras no tengas dominio).

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.tu-dominio.com;

    client_max_body_size 4k;
    server_tokens off;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
# Despues de que el dominio apunte al EC2:  sudo certbot --nginx -d api.tu-dominio.com
# Certbot agrega el bloque "listen 443 ssl" y la redireccion de HTTP a HTTPS.
